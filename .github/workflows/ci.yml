name: CI Quality & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML5
        run: |
          # Basic syntax check for HTML structure
          grep -q "<!DOCTYPE html>" index.html
          grep -q "<html" index.html
          grep -q "</html>" index.html
          echo "HTML structure verified successfully!"
